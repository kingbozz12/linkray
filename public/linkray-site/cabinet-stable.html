<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control"
        content="no-store, no-cache, must-revalidate">
  <meta name="theme-color" content="#061521">
  <title>Личный кабинет — LinkRay</title>
  <link rel="icon" href="/linkray-site/favicon-64.png">
  <link rel="stylesheet"
        href="/linkray-site/cabinet-stable.css?v=20260806-analytics-toggle-v1">
  <script src="/linkray-site/cabinet-stable.js?v=20260806-analytics-toggle-v1"
          defer></script>
</head>
<body>
  <main id="lr-cabinet" class="cabinet-shell" aria-live="polite">
    <section class="state-card">
      <img class="state-logo"
           src="/linkray-site/linkray-logo-exact.webp"
           alt="LinkRay"
           onerror="this.src='/linkray-site/icon-192.png'">
      <h1>Загружаем кабинет</h1>
      <p>Получаем каналы, аналитику и события.</p>
      <div class="spinner" aria-label="Загрузка"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Разделы кабинета">
    <button type="button" data-tab="overview" class="active">
      <span class="nav-icon">▦</span>
      <span>Обзор</span>
    </button>

    <button type="button" data-tab="channels">
      <span class="nav-icon">▤</span>
      <span>Каналы</span>
    </button>

    <a href="https://max.ru/se13353901_bot"
       target="_blank"
       rel="noopener noreferrer">
      <span class="nav-icon">➤</span>
      <span>Studio в MAX</span>
    </a>
  </nav>
</body>
</html>
